<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Sales | Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0ea5e9 100%);
            color: #f8fafc;
            padding: 24px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 64px;
            height: 64px;
            background: #0ea5e9;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            margin: 0 auto 20px;
        }
        h1 { font-size: 1.75rem; margin-bottom: 8px; }
        p { color: #94a3b8; margin-bottom: 32px; line-height: 1.5; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        a {
            display: block;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        a:hover { transform: translateY(-2px); }
        .primary {
            background: #0ea5e9;
            color: #fff;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
        }
        .secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .hint {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">C</div>
        <h1>CRM Sales Hub</h1>
        <p>Pagina di accesso rapido al tuo CRM locale.</p>
        <div class="links">
            <a class="primary" href="index.html">Apri CRM completo</a>
            <a class="secondary" href="index.html#clients">Lista Clienti</a>
            <a class="secondary" href="index.html#import">Importa Excel</a>
        </div>
        <p class="hint">Server locale: http://localhost:8765</p>
    </div>
</body>
</html>
